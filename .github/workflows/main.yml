name: DAIOF Main CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: 🐍 Set up Python
        run: python3 --version
      - name: 📦 Install lint tools
        run: |
          python3 -m pip install --upgrade pip
          pip install black flake8

      - name: 🎨 Check formatting with Black
        run: black --check .
        continue-on-error: true

      - name: 🔍 Lint with flake8
        run: |
          flake8 . --exclude=.git,__pycache__,.pytest_cache,.mypy_cache,.venv,venv,build,dist,.consciousness,vscode-merged --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --exclude=.git,__pycache__,.pytest_cache,.mypy_cache,.venv,venv,build,dist,.consciousness,vscode-merged --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 📥 Checkout code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: 🐍 Set up Python
        run: python3 --version
      - name: 📦 Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 Run tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
        continue-on-error: true
