name: 📦 Auto Dependency Updates

on:
#   schedule:
    # Check for dependency updates weekly on Monday
#     - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_dependencies:
    runs-on: ubuntu-latest
    name: Update Dependencies
    
    steps:
      - name: 🧬 Checkout Repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: 🐍 Setup Python
        run: python3 --version
      - name: 📦 Install pip-tools
        run: |
          pip install pip-tools pip-check-updates
      
      - name: 🔍 Check for Updates
        id: check_updates
        run: |
          echo "Checking for dependency updates..."
          
          # Create temp file for updates
          if [ -f "requirements.txt" ]; then
            pip list --outdated --format=json > outdated.json
            
            if [ -s outdated.json ] && [ "$(cat outdated.json)" != "[]" ]; then
              echo "has_updates=true" >> $GITHUB_OUTPUT
              echo "Updates available:"
              cat outdated.json
            else
              echo "has_updates=false" >> $GITHUB_OUTPUT
              echo "All dependencies up to date"
            fi
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 📝 Update Requirements
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          # Backup current requirements
          cp requirements.txt requirements.txt.bak
          
          # Update to latest compatible versions
          pip install --upgrade -r requirements.txt
          pip freeze > requirements.txt
          
          # Show diff
          echo "Changes:"
          diff requirements.txt.bak requirements.txt || true
      
      - name: ✅ Run Tests
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          # Install updated dependencies
          pip install -r requirements.txt
          
          # Run tests if they exist
          if [ -d "tests" ]; then
            pip install pytest
            pytest || echo "Tests failed, will not create PR"
          fi
      
      - name: 🔀 Create Pull Request (gh CLI, no external action)
        if: steps.check_updates.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f requirements.txt.bak outdated.json
          if git diff --quiet -- requirements.txt; then
            echo "No requirements changes to propose."; exit 0
          fi
          branch="auto-update-dependencies"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add requirements.txt
          git commit -m "📦 Update dependencies"
          git push -f origin "$branch"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "📦 Auto: Update dependencies" \
            --body "## 🤖 Automated Dependency Update

          This PR updates project dependencies to their latest compatible versions, as detected by the Digital Organism.

          - Dependencies updated successfully
          - Tests run when present

          ---
          *Auto-generated by Digital Organism*" \
            --label "dependencies" --label "auto-generated" || \
          gh pr edit "$branch" --add-label "dependencies,auto-generated" || true
