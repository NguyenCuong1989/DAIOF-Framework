name: 🔍 PR Governance Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  governance-review:
    runs-on: ubuntu-latest
    name: Governance risk assessment

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install governance dependencies
        run: python -m pip install pyyaml

      - name: Validate governance evidence
        run: python tools/governance/governance_gate.py validate

      - name: Assess PR risk without approving or merging
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const protectedPrefixes = [
              '.github/workflows/',
              'governance/',
              'tools/governance/',
              'src/hyperai/core/',
              'tools/runtime/'
            ];
            const protectedFiles = files
              .map(file => file.filename)
              .filter(name => protectedPrefixes.some(prefix => name.startsWith(prefix)));
            const largeFiles = files
              .filter(file => file.additions + file.deletions > 500)
              .map(file => file.filename);
            const risk = protectedFiles.length || largeFiles.length ? 'HIGH' : 'STANDARD';
            const body = [
              '## Governance review',
              `- Risk class: **${risk}**`,
              `- Protected surfaces changed: ${protectedFiles.length ? protectedFiles.join(', ') : 'none'}`,
              `- Large files changed: ${largeFiles.length ? largeFiles.join(', ') : 'none'}`,
              '- Human approval: **required**',
              '- Automated approval/merge: **disabled by governance policy**',
              '',
              'Required checks and branch protection remain the authority for merge readiness.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });
