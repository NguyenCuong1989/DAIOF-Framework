name: Governance and Runtime Topology Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'
      - 'governance/**'
      - 'tools/governance/**'
      - 'tests/governance/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: Validate governance evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install pytest pyyaml

      - name: Validate workflow and runtime topology evidence
        run: python tools/governance/governance_gate.py validate

      - name: Run governance tests
        run: python -m pytest tests/governance -q
