name: 🤖 Enhanced Issue Automation

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      process_all:
        description: 'Process all open issues'
        required: false
        default: 'false'

permissions:
  issues: write
  contents: read

jobs:
  process-issue:
    runs-on: ubuntu-latest
    name: Intelligent Issue Processing
    
    steps:
      - name: 📥 Checkout Repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: 🐍 Setup Python
        run: python3 --version
      - name: 📦 Install Dependencies
        run: |
          pip install PyGithub
      
      - name: 🤖 Process New Issue
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DRY_RUN: 'false'
        run: |
          python3 .github/scripts/enhanced_issue_handler.py
      
      - name: 🔄 Process All Issues
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.process_all == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: 'false'
        run: |
          python3 .github/scripts/enhanced_issue_handler.py
      
      - name: 📊 Report Results
        if: always()
        run: |
          echo "✅ Issue automation completed"
          echo "Powered by HYPERAI Framework"
          echo "Creator: Nguyễn Đức Cường (alpha_prime_omega)"
